name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly vulnerability scan, so new advisories show up without a commit.
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # release.yml runs it before a release that is started by hand or by a tag.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Install tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test 2>&1 | tee "$RUNNER_TEMP/unit.log"
      - name: Integration tests
        run: make test-integration 2>&1 | tee "$RUNNER_TEMP/integration.log"
      - name: End-to-end tests
        run: make test-e2e 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - name: Security
        run: make security 2>&1 | tee "$RUNNER_TEMP/security.log"
      - name: Show failed tests
        if: failure()
        run: |
          # As an annotation: on the summary page, and readable without a login.
          cat "$RUNNER_TEMP"/*.log 2>/dev/null |
            grep -aE '^ *--- FAIL|_test\.go:[0-9]+: |^panic:|RemoveAll' | head -n 60 |
            tr -d '\r' | sed 's/%/%25/g' | awk '{ m = m $0 "%0A" } END { if (m) print "::error title=Failed tests::" m }'
      - name: Loop-device tests (Linux, root)
        if: runner.os == 'Linux'
        run: sudo --preserve-env=PATH,HOME,GOPATH,GOMODCACHE,GOCACHE env "PATH=$PATH" go test -tags integration,loopdev -count=1 ./internal/volume/...

  cross-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Build for Windows (amd64, arm64)
        run: make build-windows
      - name: Build for Linux (amd64, arm64)
        run: make build-linux
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis rpm osslsigncode
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Sign Windows executables (skipped without certificate)
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: scripts/sign-windows.sh dist/usb-backup.exe dist/usb-backup-cli.exe
      - name: Windows setup (NSIS)
        run: make setup-windows
      - name: Sign Windows setup (skipped without certificate)
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: scripts/sign-windows.sh dist/USB-Backup-Setup.exe
      - name: Linux packages (deb, rpm, tar.gz)
        run: make packages-linux
      - name: Check package contents
        run: |
          for f in dist/*.deb; do dpkg --contents "$f"; done
          for f in dist/*.rpm; do rpm -qlp "$f"; done
          for f in dist/*.tar.gz; do tar -tzf "$f"; done
          dpkg --contents dist/usb-backup_*_amd64.deb | grep -q ' ./usr/bin/usb-backup-cli$'
          rpm -qlp dist/*x86_64.rpm | grep -qx /usr/bin/usb-backup-cli
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  vulncheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: $(go env GOPATH)/bin/govulncheck ./...
