name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly vulnerability scan, so new advisories show up without a commit.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Integration tests
        run: make test-integration
      - name: End-to-end tests
        run: make test-e2e
      - name: Security
        run: make security
      - name: Loop-device tests (Linux, root)
        if: runner.os == 'Linux'
        run: sudo --preserve-env=PATH,HOME,GOPATH,GOMODCACHE,GOCACHE env "PATH=$PATH" go test -tags integration,loopdev -count=1 ./internal/volume/...

  cross-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build for Windows (amd64, arm64)
        run: make build-windows
      - name: Build for Linux (amd64, arm64)
        run: make build-linux
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  vulncheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: $(go env GOPATH)/bin/govulncheck ./...
