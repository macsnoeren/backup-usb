# Makes a release of the newest version in CHANGELOG.md, never before ci
# passed on that commit:
#  - on its own: after ci passed for a push to main, when the version has no
#    tag and no release yet. What is under "Unreleased" is work in progress
#    and is not released.
#  - by hand: Actions → release → Run workflow, and fill in the tag (v1.2.3).
#    ci runs first.
#  - by pushing a tag v1.2.3; ci runs first. A tag like v1.2.3-rc1 becomes a
#    pre-release with the "Unreleased" notes.
# The release gets the Windows setup, .deb, .rpm, .tar.gz and .zip files,
# SHA256SUMS signed with cosign, and the CHANGELOG.md section of that version
# as release notes.
name: release
run-name: release ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '(after ci)' }}

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, the newest version in CHANGELOG.md (v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

# Per commit: a waiting run would be dropped when a third one comes. Two
# commits cannot release the same version, as the tag can be pushed only once.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  # The commit that ci tested. With workflow_run, github.sha is the newest
  # commit on main, which can be another one.
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  check:
    # After ci: only when it passed for a push to main of this repository.
    # A pull request from a fork can have a branch called main as well.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT }}
      - name: Is there something to release?
        id: plan
        env:
          # Only used as environment variables, never pasted into a script.
          INPUT_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh scripts/plan-release.sh > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        if: steps.plan.outputs.release == 'true' || steps.plan.outputs.notes == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: sh scripts/release-notes.sh "$TAG" > release-notes.md
      - uses: actions/upload-artifact@v6
        if: steps.plan.outputs.release == 'true' || steps.plan.outputs.notes == 'true'
        with:
          name: release-notes
          path: release-notes.md

  # A release without a text gets its section of CHANGELOG.md.
  notes:
    needs: check
    if: needs.check.outputs.notes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # change the text of the release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
      - name: Fill in the text of the release
        env:
          TAG: ${{ needs.check.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md

  ci:
    needs: check
    if: needs.check.outputs.release == 'true' && github.event_name != 'workflow_run'
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: [check, ci]
    # ci is skipped only after a workflow_run, where it passed already.
    if: >-
      !cancelled() &&
      needs.check.result == 'success' &&
      needs.check.outputs.release == 'true' &&
      (needs.ci.result == 'success' ||
       (needs.ci.result == 'skipped' && github.event_name == 'workflow_run'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    permissions:
      contents: write # create the tag and the release
      id-token: write # keyless signing of SHA256SUMS with cosign
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable # the newest security fixes, as in ci.yml
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis osslsigncode
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Make the tag
        id: tag
        if: github.ref_type == 'branch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG exists already on this commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          # A tag pushed with this token does not start the workflow again.
          git push origin "refs/tags/$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Remove the new tag when there is no release
        if: (failure() || cancelled()) && steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$TAG" >/dev/null 2>&1 || git push origin ":refs/tags/$TAG"
