# Makes a release of a version in CHANGELOG.md, in one of two ways:
#  - Actions → release → Run workflow, and fill in the tag (v1.2.3). After the
#    tests the workflow makes the tag on the main branch.
#  - push a tag v1.2.3.
# The release gets the Windows setup, .deb, .rpm, .tar.gz and .zip files,
# SHA256SUMS signed with cosign, and the CHANGELOG.md section of that version
# as release notes. A tag like v1.2.3-rc1 becomes a pre-release with the
# "Unreleased" notes.
name: release
run-name: release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, the newest version in CHANGELOG.md (v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Only used as an environment variable, never pasted into a script.
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag fits CHANGELOG.md
        run: sh scripts/check-release.sh "$TAG"
      - name: The tag can be made on this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          MAIN: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "$MAIN" ]; then
            echo "::error::Releases are made from $MAIN, not from $GITHUB_REF."
            exit 1
          fi
          # An annotated tag is listed twice; the last line is its commit.
          sha=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | tail -n 1 | cut -f 1)
          if [ -n "$sha" ] && [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::The tag $TAG exists already, on another commit ($sha). Use the next version. If $TAG was never released you can delete it first: git push origin :refs/tags/$TAG"
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "$TAG" > release-notes.md
      - uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: release-notes.md

  test:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable # the newest security fixes, as in ci.yml
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make lint
      - run: make test test-integration test-e2e
      - run: govulncheck ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release
      id-token: write # keyless signing of SHA256SUMS with cosign
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable # the newest security fixes, as in ci.yml
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis osslsigncode
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Make the tag
        id: tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG exists already on this commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          # A tag pushed with this token does not start the workflow again.
          git push origin "refs/tags/$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Remove the new tag when there is no release
        if: (failure() || cancelled()) && steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$TAG" >/dev/null 2>&1 || git push origin ":refs/tags/$TAG"
