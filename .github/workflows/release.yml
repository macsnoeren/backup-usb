# Makes a release of the newest version in CHANGELOG.md:
#  - on its own: a push to main with a version that has no tag and no release
#    yet. What is under "Unreleased" is work in progress and is not released.
#  - by hand: Actions → release → Run workflow, and fill in the tag (v1.2.3).
#  - by pushing a tag v1.2.3. A tag like v1.2.3-rc1 becomes a pre-release with
#    the "Unreleased" notes.
# The tests run first. The release gets the Windows setup, .deb, .rpm, .tar.gz
# and .zip files, SHA256SUMS signed with cosign, and the CHANGELOG.md section
# of that version as release notes.
name: release
run-name: release ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '(new version in the changelog?)' }}

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag, the newest version in CHANGELOG.md (v1.2.3)"
        required: true
        type: string

permissions:
  contents: read

# One at a time: a second push waits, and then sees that the tag exists.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Is there something to release?
        id: plan
        env:
          # Only used as environment variables, never pasted into a script.
          INPUT_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sh scripts/plan-release.sh > "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan"
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: sh scripts/release-notes.sh "$TAG" > release-notes.md
      - uses: actions/upload-artifact@v6
        if: steps.plan.outputs.release == 'true'
        with:
          name: release-notes
          path: release-notes.md

  test:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable # the newest security fixes, as in ci.yml
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make lint
      - run: make test test-integration test-e2e
      - run: govulncheck ./...

  release:
    needs: [check, test]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    permissions:
      contents: write # create the tag and the release
      id-token: write # keyless signing of SHA256SUMS with cosign
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable # the newest security fixes, as in ci.yml
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis osslsigncode
      - uses: sigstore/cosign-installer@v3
      - uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Make the tag
        id: tag
        if: github.ref_type == 'branch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG exists already on this commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          # A tag pushed with this token does not start the workflow again.
          git push origin "refs/tags/$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Remove the new tag when there is no release
        if: (failure() || cancelled()) && steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$TAG" >/dev/null 2>&1 || git push origin ":refs/tags/$TAG"
